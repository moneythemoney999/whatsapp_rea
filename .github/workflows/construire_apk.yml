# Nom du workflow d'intégration continue pour la compilation de l'APK
name: Construire l'APK Android

on:
  push:
    branches:
      - principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Mise en cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Nettoyage du projet Flutter
        run: flutter clean

      - name: Installation des dépendances
        run: flutter pub get

      - name: Vérification de l'environnement Flutter
        run: flutter doctor -v

      - name: Compilation de l'APK pour Android
        run: flutter build apk --debug

      - name: Mise en ligne de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: messagerie_instantanee_apk
          path: build/app/outputs/flutter-apk/app-debug.apk
