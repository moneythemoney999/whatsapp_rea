plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.exemple.messagerie"
    compileSdkVersion flutter.compileSdkVersion.toInteger()
    targetSdkVersion flutter.targetSdkVersion.toInteger()
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.exemple.messagerie"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion.toInteger()
        versionCode flutterVersionCode != null ? flutterVersionCode.toInteger() : 1
        versionName flutterVersionName != null ? flutterVersionName : "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
